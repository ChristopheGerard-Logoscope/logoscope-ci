# ---------------------------------------------------------------------------
# Logoscope CI — classification de genre des articles RSS (Node).
# Vague 1. Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN,
# SUPABASE_URL, CRON_SECRET, YT_RUNNER_URL.
# La clé Lovable AI n'est pas un secret GitHub : le runner la récupère via
# le hook /api/public/hooks/ai-key, authentifié par CRON_SECRET.
# ---------------------------------------------------------------------------
name: classify-rss-articles

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Duree max du run en minutes (defaut 25)"
        required: false
        default: "25"
      batch_size:
        description: "Articles a classer par lot (defaut 30)"
        required: false
        default: "30"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: classify-rss-articles
      cancel-in-progress: false
    steps:
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Classify RSS articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 2026-08-03 : la clé service role n'est plus copiée ici — le runner la
          # récupère via le hook /api/public/hooks/service-key (x-cron-secret).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          CLASSIFY_MAX_MINUTES: ${{ inputs.max_minutes || '25' }}
          CLASSIFY_BATCH_SIZE: ${{ inputs.batch_size || '30' }}
        run: bun run scripts/classify-rss-articles.ts
