# ---------------------------------------------------------------------------
# Logoscope CI — detection YouTube (runner Node).
# Vague 3. Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN,
# YT_RUNNER_URL, YT_RUNNER_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY.
# ---------------------------------------------------------------------------
name: yt-detect

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Commentaires par claim (defaut 20)"
        required: false
        default: "20"
      max_batches:
        description: "Nombre max de claims dans un run (defaut 10)"
        required: false
        default: "10"
  schedule:
    - cron: "*/10 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: yt-detect
      cancel-in-progress: false
    steps:
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run YouTube detection
        env:
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          YT_RUNNER_SECRET: ${{ secrets.YT_RUNNER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YT_BATCH_SIZE: ${{ inputs.batch_size || '20' }}
          YT_MAX_BATCHES: ${{ inputs.max_batches || '10' }}
        run: bun run scripts/yt-detect-runner.ts
