# ---------------------------------------------------------------------------
# Logoscope CI — detection Mastodon (runner Node) + passe hebdo du registre.
# Vague 3. Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN,
# YT_RUNNER_URL, YT_RUNNER_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY,
# CRON_SECRET.
# ---------------------------------------------------------------------------
name: mastodon-detect

on:
  workflow_dispatch: {}
  schedule:
    - cron: "45 6,14 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mastodon-detect
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ vars.PRIVATE_REPO }}" ]; then
            echo "ERROR: PRIVATE_REPO n'est pas defini (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "ERROR: le secret PRIVATE_REPO_TOKEN n'est pas defini."
            exit 1
          fi
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
          path: private-repo
      - name: Verify checkout contains package.json
        run: |
          if [ ! -f private-repo/package.json ]; then
            echo "ERROR: private-repo/package.json introuvable — PRIVATE_REPO ou PAT incorrect."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: private-repo
      - name: Run Mastodon detection
        env:
          SOCIAL_PLATFORM: mastodon
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          YT_RUNNER_SECRET: ${{ secrets.YT_RUNNER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bun run scripts/social-discover-runner.ts
        working-directory: private-repo

      - name: Maintain Mastodon source registry (weekly)
        if: ${{ success() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 2026-08-03 : la clé service role n'est plus copiée ici — le runner la
          # récupère via le hook /api/public/hooks/service-key (x-cron-secret).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
        working-directory: private-repo
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -lt 12 ]; then
            bun run scripts/maintain-mastodon-sources.ts
          else
            echo "skip: passe hebdomadaire reservee au lundi matin (UTC)"
          fi
