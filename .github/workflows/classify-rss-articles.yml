# ---------------------------------------------------------------------------
# Classification de genre des articles RSS en Node (2026-08-02).
#
# L'auto-classification a été retirée du worker d'ingestion Cloudflare pour
# libérer du budget temps/mémoire. Ce workflow consomme la file d'articles
# non classés en boucle, sans limite de wall-time worker.
#
# Secrets requis : SUPABASE_URL, CRON_SECRET,
# YT_RUNNER_URL. La clé Lovable AI n'est plus un secret GitHub : le runner
# la récupère via le hook /api/public/hooks/ai-key (auth CRON_SECRET).
# ---------------------------------------------------------------------------
name: classify-rss-articles

on:
  # 2026-08-03 : cadence transférée au repo public `logoscope-ci`
  # (ci-public/workflows/classify-rss-articles.yml). Ne pas réactiver ici :
  # double classification.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Durée max du run en minutes (défaut 25)"
        required: false
        default: "25"
      batch_size:
        description: "Articles à classer par lot (défaut 30)"
        required: false
        default: "30"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: classify-rss-articles
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Classify RSS articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 2026-08-03 : la clé service role n'est plus copiée ici — le runner la
          # récupère via le hook /api/public/hooks/service-key (x-cron-secret).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          CLASSIFY_MAX_MINUTES: ${{ inputs.max_minutes || '25' }}
          CLASSIFY_BATCH_SIZE: ${{ inputs.batch_size || '30' }}
        run: bun run scripts/classify-rss-articles.ts
