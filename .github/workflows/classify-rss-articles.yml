# ---------------------------------------------------------------------------
# Logoscope CI — classification de genre des articles RSS (Node).
# Vague 1. Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN,
# SUPABASE_URL, CRON_SECRET, YT_RUNNER_URL.
# La clé Lovable AI n'est pas un secret GitHub : le runner la récupère via
# le hook /api/public/hooks/ai-key, authentifié par CRON_SECRET.
# ---------------------------------------------------------------------------
name: classify-rss-articles

on:
  schedule:
    # 2026-08-03 : cadence tenue par le runner lui-meme (boucle interne de
    # 50 min, attente CLASSIFY_IDLE_MS quand la file est vide). GitHub ne
    # sert plus qu'a relancer le run : la boucle etant plus longue que
    # l'intervalle de creneau, un creneau saute ne cree plus de trou.
    - cron: "*/30 * * * *"
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Duree max du run en minutes (defaut 50)"
        required: false
        default: "50"
      batch_size:
        description: "Articles a classer par lot (defaut 30)"
        required: false
        default: "30"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: classify-rss-articles
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ vars.PRIVATE_REPO }}" ]; then
            echo "ERROR: PRIVATE_REPO n'est pas defini (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "ERROR: le secret PRIVATE_REPO_TOKEN n'est pas defini."
            exit 1
          fi
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
          path: private-repo
      - name: Verify checkout contains package.json
        run: |
          if [ ! -f private-repo/package.json ]; then
            echo "ERROR: private-repo/package.json introuvable — PRIVATE_REPO ou PAT incorrect."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: private-repo
      - name: Classify RSS articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 2026-08-03 : la clé service role n'est plus copiée ici — le runner la
          # récupère via le hook /api/public/hooks/service-key (x-cron-secret).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          CLASSIFY_MAX_MINUTES: ${{ inputs.max_minutes || '50' }}
          CLASSIFY_BATCH_SIZE: ${{ inputs.batch_size || '30' }}
        run: bun run scripts/classify-rss-articles.ts
        working-directory: private-repo
