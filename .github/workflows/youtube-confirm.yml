# ---------------------------------------------------------------------------
# Logoscope CI — voie B YouTube confirm (runner Node).
# Vague 3. Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN,
# YT_RUNNER_URL, YT_RUNNER_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY,
# YOUTUBE_API_KEY.
# ---------------------------------------------------------------------------
name: youtube-confirm

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5,17 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: youtube-confirm
      cancel-in-progress: false
    steps:
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run YouTube confirm
        env:
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          YT_RUNNER_SECRET: ${{ secrets.YT_RUNNER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: bun run scripts/yt-confirm-runner.ts
