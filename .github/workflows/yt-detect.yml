# ---------------------------------------------------------------------------
# Logoscope CI — detection YouTube (runner Node).
# Vague 3. Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN,
# YT_RUNNER_URL, YT_RUNNER_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY.
# ---------------------------------------------------------------------------
name: yt-detect

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Commentaires par claim (defaut 20)"
        required: false
        default: "20"
      max_batches:
        description: "Nombre max de claims dans un run (defaut 10)"
        required: false
        default: "10"
  schedule:
    - cron: "7 7,19 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: yt-detect
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ vars.PRIVATE_REPO }}" ]; then
            echo "ERROR: PRIVATE_REPO n'est pas defini (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "ERROR: le secret PRIVATE_REPO_TOKEN n'est pas defini."
            exit 1
          fi
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
          path: private-repo
      - name: Verify checkout contains package.json
        run: |
          if [ ! -f private-repo/package.json ]; then
            echo "ERROR: private-repo/package.json introuvable — PRIVATE_REPO ou PAT incorrect."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        continue-on-error: true
      - name: Install spaCy + fr_core_news_sm
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install "spacy>=3.7,<4"
          python -m spacy download fr_core_news_sm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
        working-directory: private-repo
      - name: Run YouTube detection
        env:
          VERB_FRAGMENT_APPLY: ${{ vars.VERB_FRAGMENT_APPLY }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          YT_RUNNER_SECRET: ${{ secrets.YT_RUNNER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YT_BATCH_SIZE: ${{ inputs.batch_size || '20' }}
          YT_MAX_BATCHES: ${{ inputs.max_batches || '10' }}
        run: bun run scripts/yt-detect-runner.ts
        working-directory: private-repo
