# ---------------------------------------------------------------------------
# Logoscope CI — detection Bluesky (runner Node).
# Vague 3. Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN,
# YT_RUNNER_URL, YT_RUNNER_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY,
# BLUESKY_IDENTIFIER, BLUESKY_APP_PASSWORD.
# ---------------------------------------------------------------------------
name: bluesky-detect

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 6,14 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bluesky-detect
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ vars.PRIVATE_REPO }}" ]; then
            echo "ERROR: PRIVATE_REPO n'est pas defini (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "ERROR: le secret PRIVATE_REPO_TOKEN n'est pas defini."
            exit 1
          fi
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
          path: private-repo
      - name: Verify checkout contains package.json
        run: |
          if [ ! -f private-repo/package.json ]; then
            echo "ERROR: private-repo/package.json introuvable — PRIVATE_REPO ou PAT incorrect."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: private-repo
      - name: Run Bluesky detection
        env:
          SOCIAL_PLATFORM: bluesky
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          YT_RUNNER_SECRET: ${{ secrets.YT_RUNNER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: bun run scripts/social-discover-runner.ts
        working-directory: private-repo
