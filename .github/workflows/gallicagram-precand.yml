# ---------------------------------------------------------------------------
# Logoscope CI — juge de frequence Gallicagram (Le Monde 1944-2023) sur les
# pre-candidats MWE, execute EN NODE hors Worker Cloudflare (etape 3/3,
# 2026-08-28).
#
# Motif : le hook Worker equivalent renvoie 502 depuis le 24/07 (OOM Hunspell),
# soit 0 verdict/jour malgre le cron quotidien. Ici : boucle bornee (50 min,
# 1200 appels max), politesse 400 ms, cache 180 j => reprise idempotente.
#
# GALLICA_APPLY=0 par defaut : DRY-RUN (mesure sans basculer en dismissed).
# Passer la variable de repo GALLICA_APPLY a "1" pour activer le rejet reel.
#
# Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN, SUPABASE_URL,
# CRON_SECRET, YT_RUNNER_URL.
# ---------------------------------------------------------------------------
name: gallicagram-precand

on:
  schedule:
    # 3 creneaux/jour, decales des drains de detection pour eviter la congestion.
    - cron: "20 1,9,17 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "1 = rejet reel, 0 = dry-run"
        required: false
        default: "0"
      max_minutes:
        description: "Duree max du run en minutes (defaut 50)"
        required: false
        default: "50"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: gallicagram-precand
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ vars.PRIVATE_REPO }}" ]; then
            echo "ERROR: PRIVATE_REPO n'est pas defini."
            exit 1
          fi
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "ERROR: le secret PRIVATE_REPO_TOKEN n'est pas defini."
            exit 1
          fi
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
          path: private-repo
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: private-repo
      - name: Gallicagram gate sur pre-candidats MWE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          GALLICA_MAX_MINUTES: ${{ inputs.max_minutes || '50' }}
          GALLICA_APPLY: ${{ inputs.apply || vars.GALLICA_APPLY || '0' }}
        run: bun run scripts/gallicagram-precand-runner.ts
        working-directory: private-repo
