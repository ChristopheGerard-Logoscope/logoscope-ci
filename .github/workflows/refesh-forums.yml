# ---------------------------------------------------------------------------
# Lanceur de la collecte forum (remplace la tâche pg_cron refresh-forums-weekly,
# qui reste inactive). Plusieurs vagues de 8 sondes, au moins 8 s entre deux
# vagues. Tant que le réglage `forum_runner_enabled` n'est pas à true, le hook
# répond en simulation (aucun crédit Firecrawl consommé).
# Déclenchement manuel uniquement.
# ---------------------------------------------------------------------------
name: refresh-forums

on:
  workflow_dispatch:
    inputs:
      waves:
        description: "Nombre de vagues de 8 sondes"
        required: false
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: refresh-forums
      cancel-in-progress: false
    steps:
      - name: Waves
        env:
          HOOK_URL: ${{ secrets.YT_RUNNER_URL }}/api/public/hooks/refresh-forums
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WAVES: ${{ github.event.inputs.waves }}
        run: |
          set -euo pipefail
          n="${WAVES:-1}"
          for i in $(seq 1 "$n"); do
            echo "=== Vague $i/$n ==="
            resp="$(mktemp)"
            code=$(curl -sS -o "$resp" -w "%{http_code}" -X POST "$HOOK_URL" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: $CRON_SECRET" \
              --max-time 900 -d '{"manual":true}')
            echo "HTTP $code"; head -c 4096 "$resp"; echo
            if command -v jq >/dev/null && jq -e '.probes' "$resp" >/dev/null 2>&1; then
              {
                echo "### Vague $i/$n"
                echo ""
                echo "| Mot | Origine | Résultat | Attestations | Crédits |"
                echo "|---|---|---|---|---|"
                jq -r '.probes[] | "| \(.lemma) | \(.pool) | \(.result) | \(.hits) | \(.credits) |"' "$resp"
                echo ""
                jq -r '"Crédits : \(.creditsSpent) · reste à sonder : \(.remainingDue) · arrêt : \(.stoppedByBudget // "aucun")"' "$resp"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            case "$code" in 2*) ;; *) exit 22 ;; esac
            if grep -q '"simulation":true' "$resp"; then echo "Simulation : arrêt après une vague."; break; fi
            if grep -q '"stoppedByBudget":"' "$resp"; then echo "Arrêt budget/réserve."; break; fi
            if grep -q '"probed":0' "$resp"; then echo "Plus rien à sonder."; break; fi
            rm -f "$resp"
            if [ "$i" -lt "$n" ]; then sleep 10; fi
          done
          exit 0
