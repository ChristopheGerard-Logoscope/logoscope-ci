# ---------------------------------------------------------------------------
# Logoscope CI — drain du backlog de détection (route « long », en Node).
# Vague 1. Variable requise : PRIVATE_REPO. Secrets : PRIVATE_REPO_TOKEN,
# SUPABASE_URL, CRON_SECRET, YT_RUNNER_URL.
# ---------------------------------------------------------------------------
name: drain-detection

on:
  schedule:
    # 2026-08-03 : boucle interne de 50 min > intervalle de creneau, plus un
    # second cron decale. Un creneau saute ne cree plus de trou.
    - cron: "*/30 * * * *"
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Duree max du drain en minutes (defaut 50)"
        required: false
        default: "50"
      route:
        description: "Longueur ciblee : long (> 1200 car., defaut) ou short"
        required: false
        default: "long"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: drain-detection
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ vars.PRIVATE_REPO }}" ]; then
            echo "ERROR: PRIVATE_REPO n'est pas defini (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "ERROR: le secret PRIVATE_REPO_TOKEN n'est pas defini."
            exit 1
          fi
      - name: Checkout code prive
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          persist-credentials: false
          path: private-repo
      - name: Verify checkout contains package.json
        run: |
          if [ ! -f private-repo/package.json ]; then
            echo "ERROR: private-repo/package.json introuvable — PRIVATE_REPO ou PAT incorrect."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: private-repo
      - name: Drain detection backlog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 2026-08-03 : la clé service role n'est plus copiée ici — le runner la
          # récupère via le hook /api/public/hooks/service-key (x-cron-secret).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          DRAIN_MAX_MINUTES: ${{ inputs.max_minutes || '50' }}
          DRAIN_ROUTE: ${{ inputs.route || 'long' }}
        run: bun run scripts/detect-long-runner.ts
        working-directory: private-repo