# ---------------------------------------------------------------------------
# Drain du backlog de détection (2026-08-01, refondu le 2026-08-02).
#
# 2026-08-02 : le drain n'appelle plus le worker Cloudflare en HTTP (> 85 %
# de 502 « Worker exceeded memory limit » sur la route `long`, quel que soit
# le plafond de texte). Il exécute la détection EN NODE, en important
# directement `runDetectionTick`. Pas de plafond mémoire, pas de timeout 25 s.
#
# Secrets requis : SUPABASE_URL, CRON_SECRET, YT_RUNNER_URL (la clé service
# role est récupérée via le hook /api/public/hooks/service-key).
# ---------------------------------------------------------------------------
name: drain-detection

on:
  # Diagnostic 2026-08-01 : le worker ne réclame que les articles <= 1200 car.
  # Les articles longs n'avaient donc plus aucun consommateur depuis le
  # routage par longueur — d'où l'arrêt du canal `rss:mwe`.
  # 2026-08-03 : cadence transférée au repo public `logoscope-ci`
  # (ci-public/workflows/drain-detection.yml), où elle était déjà active en
  # parallèle. Ne pas réactiver ici : deux drains concurrents.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Durée max du drain en minutes (défaut 45)"
        required: false
        default: "45"
      route:
        description: "Longueur ciblée : long (> 1200 car., défaut) ou short"
        required: false
        default: "long"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: drain-detection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Drain detection backlog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 2026-08-03 : la clé service role n'est plus copiée ici — le runner la
          # récupère via le hook /api/public/hooks/service-key (x-cron-secret).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          # Cadence planifiée : 30 min. On borne à 25 min pour ne pas
          # empiler deux drains concurrents.
          DRAIN_MAX_MINUTES: ${{ inputs.max_minutes || '25' }}
          DRAIN_ROUTE: ${{ inputs.route || 'long' }}
        run: bun run scripts/detect-long-runner.ts
