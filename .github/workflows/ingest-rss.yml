name: Ingest RSS (Node runner)

on:
  # 2026-08-03 : cadence transférée au repo public `logoscope-ci`
  # (ci-public/workflows/ingest-rss.yml). Ici, le repo privé n'a plus de
  # minutes Actions : le `schedule:` ne se déclenchait plus, et le
  # réactiver provoquerait une double ingestion. `workflow_dispatch`
  # conservé pour les relances manuelles depuis ce repo.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-rss-runner
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run scripts/ingest-rss-runner.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 2026-08-03 : la clé service role n'est plus copiée ici — le runner la
          # récupère via le hook /api/public/hooks/service-key (x-cron-secret).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          YT_RUNNER_URL: ${{ secrets.YT_RUNNER_URL }}
          # Boucle interne (2026-08-03) : le runner tient lui-même la cadence
          # de 5 min pendant 25 min, le scheduler GitHub étant trop irrégulier.
          INGEST_LOOP_MINUTES: '25'
          INGEST_INTERVAL_MS: '300000'
